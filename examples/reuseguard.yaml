# ReuseGuard policy example.
#
# Pass with: reuseguard check <repo> --config examples/reuseguard.yaml
# CLI flags override values from this file. Unknown keys and unknown rule IDs
# are rejected so a typo cannot silently weaken the policy.

version: 1

thresholds:
  # Skip the repository (AVOID) below this Scorecard score.
  scorecard_min: 2.0
  # A repository needs at least this score to be eligible for USE.
  use_scorecard_min: 5.0

limits:
  max_candidates: 5
  min_stars: 50
  max_repo_mb: 150
  max_files: 2000
  max_file_kb: 1024
  max_scan_mb: 20
  timeout: 20

features:
  recall: true
  scorecard: true
  scan: true

rules:
  # Built-in rule IDs available in this version:
  #   py-eval-exec, py-shell-true, py-os-command, py-unsafe-deserialize,
  #   py-marshal-loads, py-encoded-exec, js-eval, js-new-function,
  #   js-child-process, js-encoded-eval, download-pipe-shell,
  #   powershell-download-exec, powershell-encoded, unicode-bidi,
  #   private-key, aws-access-key, github-token, slack-token,
  #   generic-secret, rm-rf-root, chmod-777, npm-lifecycle,
  #   pth-startup-code, vscode-folder-open, ci-pwn-request,
  #   ci-write-all, docker-add-url, setup-cmdclass
  #
  # External scanner rule IDs are also accepted when prefixed with a known
  # scanner name: gitleaks:, osv:, semgrep:. Unknown prefixes are rejected.
  disable: []
  severity: {}
  # Examples:
  # disable:
  #   - generic-secret            # built-in rule
  #   - gitleaks:aws-access-token # external (gitleaks)
  # severity:
  #   py-eval-exec: high          # built-in override
  #   osv:GHSA-abcd-1234-wxyz: critical  # external (osv-scanner)

suppress:
  # Glob patterns are matched against repository-relative POSIX paths.
  # Findings in matching files are still recorded, but do not affect risk.
  paths: []
  # Example:
  # paths:
  #   - "src/generated/**"
  #   - "migrations/*.py"

# Behavior probe (M4). A policy may only tune limits and pin the image; it can
# never enable the probe, because that executes untrusted repository code and
# must stay an explicit command-line action (`--behavior`). Setting
# `behavior.enabled`, `behavior.mode`, or `behavior.keep_workdir` is a hard
# error, and `image` must be pinned by digest just like `--behavior-image`.
#
# behavior:
#   image: "python@sha256:<64 hex characters>"
#   timeout_seconds: 300          # 30-1800, total budget for one run
#   phase_timeout_seconds: 120    # 10-900, budget for one phase
#   memory_mb: 512                # 128-4096
#   cpus: 1.0                     # 0.1-4.0
#   pids: 128                     # 16-512
#   max_work_mb: 512              # 64-4096
#   max_work_files: 50000         # 1000-200000
